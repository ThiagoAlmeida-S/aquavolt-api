spring.application.name=aquavolt-backend

# H2 gravando em arquivo (é isso que garante a persistência)
spring.datasource.url=jdbc:h2:file:./data/estacao
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA cria/atualiza as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2 para consultarmos o banco
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console